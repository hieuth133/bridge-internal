camel.main.name=vatm-bridge
camel.main.routesBuilderClasses=vn.vatm.bridge.BridgeRoutes
solace.host=tcp://localhost:55555
solace.vpn=default
solace.username=hieu
solace.password={{env:SOLACE_PASSWORD}}
rabbitmq.host=192.168.121.61
rabbitmq.port=5672
rabbitmq.vhost=swim_sg
rabbitmq.username=hieu
rabbitmq.password={{env:RABBITMQ_PASSWORD}}
bridge.out.exchange=x.swim.dev.bridge.out
bridge.out.durable-prefix=q/vnm/vatm/dev/bridge/out-
bridge.in.exchange=x.swim.dev.bridge.in
bridge.in.queue=q/vnm/vatm/dev/bridge/in
bridge.in.dlq=q/vnm/vatm/dev/bridge/in-dlq
# <in|out> <name> <source prefix> <target prefix>, entries separated by commas
bridge.rules=\
  out atfm t/vnm/vatm/dev/atfm/ t/vnm/vatm/dev/atfm/,\
  in  ext  ext/                 t/vnm/vatm/dev/ext/
